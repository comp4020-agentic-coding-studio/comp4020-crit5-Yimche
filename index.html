<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Emberlight</title>
    <meta
      name="description"
      content="Emberlight is a text dungeon that runs in a terminal. You are lowered into a sealed priory to bring up the Coalheart. What it truly is, and what you do with it, is yours to decide."
    />

    <!--
      The link-preview card: public/card.png, 1200x630. The URL resolves against
      this page, like any link. No og:title/og:description: scrapers fall back to
      the <title> and description above.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:image" content="./card.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="crt">
      <header>
        <nav aria-label="Primary">
          <span class="brand">EMBERLIGHT</span>
        </nav>
      </header>
      <main>
        <h1 class="sr-only">Emberlight: a text dungeon</h1>
        <section id="terminal" aria-label="The dungeon">
          <div id="scroll" role="log" aria-live="polite" aria-atomic="false"></div>
          <ul id="choices" aria-label="What you can do"></ul>
          <form id="prompt" autocomplete="off">
            <label for="cmd" class="caret" aria-hidden="true">&gt;</label>
            <input
              id="cmd"
              name="cmd"
              type="text"
              aria-label="Type a number to choose, or the name of something to look closer"
              spellcheck="false"
              autocapitalize="off"
              autocorrect="off"
            />
          </form>
        </section>
      </main>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
